name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: stylish-sys
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=0:FF5B1F;1:C44715;2:FF8A4D&color_dots=0:0a0a0a,1:3a1f12,2:7a3a1c,3:c44715,4:ff5b1f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
