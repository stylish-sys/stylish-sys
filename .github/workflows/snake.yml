name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: stylish-sys
          outputs: |
            dist/github-snake-dark.svg?color_snake=ff5b1f&color_dots=#161b22,#3a1f12,#7a3a1c,#c44715,#ff5b1f
            dist/github-snake-light.svg?color_snake=c44715&color_dots=#ebedf0,#ffd9c4,#ff9966,#ff6b2c,#c44715
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
